services:
  mysqldb:
    image: mysql:lts
    container_name: mysql_db_dev
    environment:
      MYSQL_ROOT_PASSWORD: contrasena
      MYSQL_DATABASE: plataforma_cursos
      MYSQL_USER: usuario
      MYSQL_PASSWORD: clave
    ports:
      - "3307:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-pcontrasena"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: spring_app_dev
    ports:
      - "8888:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/plataforma_cursos?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: usuario
      SPRING_DATASOURCE_PASSWORD: clave
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8080
    depends_on:
      mysqldb:
        condition: service_healthy
    networks:
      - app-network
    volumes:
      # Montar código fuente para reflejar cambios si usas devtools
      - .:/app

volumes:
  mysql_dev_data:

networks:
  app-network:
    driver: bridge